version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: likora_postgres_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-likora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-likora_secret}
      POSTGRES_DB: ${POSTGRES_DB:-likora_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - likora_network

  redis:
    image: redis:7-alpine
    container_name: likora_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - likora_network

  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: likora_backend_api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-likora_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-likora_secret}
      DATABASE_NAME: ${POSTGRES_DB:-likora_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - likora_network
    profiles:
      - full

  socket_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: likora_socket_service
    restart: unless-stopped
    command: ["node", "socket_service/dist/main"]
    environment:
      SOCKET_PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3001:3001"
    depends_on:
      - redis
    networks:
      - likora_network
    profiles:
      - full

networks:
  likora_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
